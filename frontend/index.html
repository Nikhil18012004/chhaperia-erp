<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="orange">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chhaperia ERP — Tape & Insulation Manufacturing Suite</title>
  <meta name="description" content="Chhaperia Cable Material ERP — inventory, production, procurement & sales with automated stock, usage and pending calculations." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <!-- Installable on the floor tablets and phones. The manifest and the
       service worker are what turn this page into an app the launcher can
       hold; the APK wrapper loads this same page. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#090b11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chhaperia" />
  <!-- No web-font download: the UI sets in the operating system's own face
       (theme.css --font). The plant PC has no internet, and the download
       shifted every text box while it arrived. Ruled 2026-08-14, applied 09-02. -->
  <link rel="stylesheet" href="css/theme.css?v=5" />
  <link rel="stylesheet" href="css/app.css?v=37" />
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-mark">
      <img src="assets/mark.png" alt="Chhaperia" />
    </div>
    <div class="splash-bar"><span></span></div>
    <div class="splash-text">CHHAPERIA&nbsp;ERP</div>
  </div>

  <!-- Login gate -->
  <div id="login" class="login-screen" hidden>
    <div class="login-card">
      <img src="assets/logo-full.png" class="login-logo" alt="Chhaperia" />
      <div class="login-title">Production &amp; ERP Suite</div>
      <div class="login-sub">Sign in to continue</div>
      <form id="loginForm" class="login-form" autocomplete="on">
        <label class="login-field">
          <span>Username</span>
          <input id="loginUser" type="text" autocomplete="username" placeholder="e.g. admin" required />
        </label>
        <label class="login-field">
          <span>Password</span>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="Your password" required />
        </label>
        <div id="loginError" class="login-error" hidden></div>
        <button type="submit" id="loginBtn" class="login-btn">Sign In</button>
      </form>
      <div class="login-foot">Chhaperia Cable Material Pvt. Ltd.</div>
    </div>
  </div>

  <div id="app" class="app-shell" hidden>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo-full.png" class="brand-logo-full" alt="Chhaperia" />
        <img src="assets/mark.png" class="brand-logo-mark" alt="Chhaperia" />
      </div>
      <nav class="nav" id="nav"><!-- nav injected --></nav>
      <div class="sidebar-foot">
        <div class="org-card">
          <div class="org-dot"></div>
          <div>
            <div class="org-name" id="orgName">Chhaperia</div>
            <div class="org-sub" id="orgSub">Loading…</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle" title="Menu" aria-label="Toggle navigation menu">☰</button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-spacer"></div>
        <button class="search-trigger" id="searchTrigger">
          <span class="si">⌕</span><span>Search anything…</span><kbd>Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">◐</button>
        <button class="icon-btn bell" id="bellBtn" title="Alerts" aria-label="View alerts">
          🔔<span class="badge" id="bellBadge" hidden>0</span>
        </button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar"></div>
          <div class="user-meta">
            <div class="user-name" id="userName">User</div>
            <div class="user-role" id="userRole"></div>
          </div>
          <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out" style="margin-left:6px">⏻</button>
        </div>
      </header>

      <main class="view" id="view"><!-- module injected --></main>
    </div>
  </div>

  <!-- Notifications drawer -->
  <div class="drawer" id="alertDrawer" hidden>
    <div class="drawer-head">
      <h3>Alerts &amp; Notifications</h3>
      <button class="icon-btn" id="closeDrawer">✕</button>
    </div>
    <div class="drawer-body" id="alertList"></div>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Command palette -->
  <div class="cmdk" id="cmdk" hidden>
    <div class="cmdk-box">
      <input id="cmdkInput" placeholder="Jump to a module, item, order…" autocomplete="off" />
      <div class="cmdk-results" id="cmdkResults"></div>
      <div class="cmdk-foot"><kbd>↑↓</kbd> navigate <kbd>enter</kbd> open <kbd>esc</kbd> close</div>
    </div>
  </div>

  <!-- Modal host -->
  <div class="modal-host" id="modalHost" hidden></div>

  <!-- Toasts -->
  <div class="toast-stack" id="toasts"></div>

  <!-- BOM line model + production maths. Shared verbatim with the backend
       (it require()s this same file), so the Edit-BOM screen and the server
       can never disagree on a number. Must load before engine/modules. -->
  <script src="js/bomcalc.js?v=1"></script>
  <script src="js/gst.js?v=1"></script>
  <script src="js/ccy.js?v=1"></script>
  <script src="js/data.js?v=10"></script>
  <script src="js/engine.js?v=13"></script>
  <script src="js/charts.js?v=9"></script>
  <script src="js/ui.js?v=12"></script>
  <script src="js/mod-common.js?v=11"></script>
  <script src="js/vendor/xlsx.full.min.js?v=1"></script>
  <script src="js/csvio.js?v=9"></script>
  <script src="js/mod-overview.js?v=10"></script>
  <script src="js/mod-inventory.js?v=17"></script>
  <script src="js/mod-production.js?v=13"></script>
  <script src="js/mod-trade.js?v=10"></script>
  <!-- the label designer's engine — symbologies, document model, canvas,
       print run. Must load BEFORE the module that mounts it. -->
  <script src="js/labelstudio.js?v=28"></script>
  <script src="js/mod-label-studio.js?v=2"></script>
  <script src="js/mod-crm.js?v=9"></script>
  <script src="js/mod-calendar.js?v=1"></script>
  <script src="js/mod-hr.js?v=1"></script>
  <script src="js/mod-dispatch.js?v=1"></script>
  <script src="js/mod-lab-reports.js?v=2"></script>
  <script src="js/mod-catalogue.js?v=2"></script>
  <script src="js/mod-tds.js?v=1"></script>
  <script src="js/mod-reports.js?v=9"></script>
  <script src="js/mod-users.js?v=9"></script>
  <script src="js/mod-supervisor.js?v=12"></script>
  <script src="js/app.js?v=14"></script>
  <script>
    /* Registered last and only over a secure origin — a service worker is
       refused on plain http anyway, except on localhost. Failing to register
       is not an error worth shouting about: the app runs exactly the same
       without it, it just cannot be installed to a home screen. */
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.info("[pwa] not installable here:", e && e.message);
        });
      });
    }
  </script>
</body>
</html>
