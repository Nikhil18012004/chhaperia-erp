# render.yaml — Render Blueprint for Chhaperia ERP
# How to deploy:
#   1. Push this repo to GitHub (already at github.com/Nikhil18012004/chhaperia-erp)
#   2. render.com  ->  New  ->  Blueprint  ->  pick this repo  ->  Apply
#   Render reads this file and provisions the service automatically.
#
# Database note: the backend needs MySQL 8.4, which Render does not host —
# provision one elsewhere (Aiven, PlanetScale, RDS…) and set CHHAPERIA_DB_URL
# below. Production refuses to boot without credentials, and refuses an
# unencrypted connection to a remote host.
services:
  - type: web
    name: chhaperia-erp
    runtime: node
    plan: free
    region: singapore        # closest free region to India; also: oregon, frankfurt, ohio, virginia
    branch: main
    buildCommand: npm install # root postinstall installs backend deps (better-sqlite3 ships prebuilt binaries)
    startCommand: npm start    # node backend/src/server.js — serves /api + the frontend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production   # engages the AUTH_SECRET fail-fast in authService
      - key: AUTH_SECRET
        generateValue: true # Render mints a random secret; never commit one here
